name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 14 is the oldest version Reclaim supports; latest catches new-SDK breakage.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The macOS 14 image defaults to an Xcode older than Swift 6; pick the newest one installed.
      - name: Select Xcode
        if: matrix.os == 'macos-14'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      # Unit tests only. The integration suite needs the RTEST-* disk images and runs locally
      # (make test-integration); it skips itself here.
      - name: Test
        run: swift test

      - name: Build app (universal)
        run: Scripts/build-app.sh

      - name: Verify bundle
        run: |
          codesign --verify --strict build/Reclaim.app
          lipo -archs build/Reclaim.app/Contents/MacOS/Reclaim
          plutil -lint build/Reclaim.app/Contents/Info.plist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'macos-latest'
        with:
          name: Reclaim-app
          path: build/Reclaim-*.zip
          if-no-files-found: error
