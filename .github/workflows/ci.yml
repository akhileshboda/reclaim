name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      # Unit tests only. The integration suite needs the RTEST-* disk images and runs locally
      # (make test-integration); it skips itself here.
      - name: Test
        run: swift test

      - name: Build app (universal)
        run: Scripts/build-app.sh

      - name: Verify bundle
        run: |
          codesign --verify --strict build/Reclaim.app
          lipo -archs build/Reclaim.app/Contents/MacOS/Reclaim
          plutil -lint build/Reclaim.app/Contents/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: Reclaim-app
          path: build/Reclaim-*.zip
          if-no-files-found: error
