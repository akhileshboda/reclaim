name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # builds the DMG and zip as artifacts without publishing anything

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "VERSION file ($(cat VERSION)) does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      # The release notes are this version's CHANGELOG section, so a release can't go out without one.
      - name: Release notes from CHANGELOG
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > build-notes.md
          grep -q '[^[:space:]]' build-notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          cat >> build-notes.md <<'NOTES'

          ---

          **Install:** download `Reclaim-*.dmg`, open it and drag Reclaim to Applications (the zip holds the same app). This build isn't notarized by Apple yet, so macOS blocks the first launch: open **System Settings › Privacy & Security** and click **Open Anyway** (macOS 15+), or right-click › Open (macOS 14). Check the download against its `.sha256` file with `shasum -a 256 -c Reclaim-*.dmg.sha256`.

          Found a problem? Use **Report a Bug…** in Reclaim's menu. If Reclaim ever deletes something outside a Trash folder, please [report it privately](https://github.com/akhileshboda/reclaim/security/advisories/new).
          NOTES
          cat build-notes.md

      - name: Test
        run: swift test

      - name: Build universal app
        run: Scripts/build-app.sh

      - name: Checksum
        run: |
          cd build
          for FILE in Reclaim-*.dmg Reclaim-*.zip; do
            shasum -a 256 "$FILE" | tee "$FILE.sha256"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Reclaim-release
          path: |
            build/Reclaim-*.dmg*
            build/Reclaim-*.zip*
            build-notes.md

      # Versions with a pre-release part (0.1.0-beta.1) are published as GitHub pre-releases, which
      # only beta builds of Reclaim are offered as updates.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" build/Reclaim-*.dmg build/Reclaim-*.dmg.sha256 \
            build/Reclaim-*.zip build/Reclaim-*.zip.sha256 \
            --verify-tag "${PRERELEASE[@]}" \
            --title "Reclaim $GITHUB_REF_NAME" \
            --notes-file build-notes.md
