name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # builds the zip as an artifact without publishing anything

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "VERSION file ($(cat VERSION)) does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Test
        run: swift test

      - name: Build universal app
        run: Scripts/build-app.sh

      - name: Checksum
        id: sum
        run: |
          cd build
          ZIP=$(ls Reclaim-*.zip)
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "zip=build/$ZIP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Reclaim-release
          path: build/Reclaim-*.zip*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Reclaim-*.zip build/Reclaim-*.zip.sha256 \
            --title "Reclaim $GITHUB_REF_NAME" \
            --notes "Unsigned build. On first launch macOS blocks it: open System Settings › Privacy & Security and click Open Anyway (macOS 15+), or right-click › Open on macOS 14. See README › Install."
