name: Feature request
description: An idea that would make Reclaim more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, before any solution.
      placeholder: I eject my camera's SD card several times a day and always forget to empty its Trash first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
